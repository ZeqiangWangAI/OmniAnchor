name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch for the injected-model tests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' av
      - name: Lint
        run: python -m ruff check src tests scripts/verify_native.py scripts/run_model_smoke.py
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Toy pipeline
        run: python -m omnianchor run --config configs/pipelines/toy_quickstart.yaml
